name: github-DOCS

on:
  pull_request:
    types: [ opened, reopened, synchronize ]
  push:
    branches: [ develop ]

permissions:
  contents: none

jobs:

  check_updates:
    if: "!contains(github.event.pull_request.labels.*.name, 'CI: skip-docs')"
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kokkos-kernels
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.2'
      - name: check API changes
        run: |
          cd kokkos-kernels
          git fetch &> /dev/null
          git diff --name-only origin/$GITHUB_BASE_REF | scripts/check_api_updates.py -v

  build:
    runs-on: [macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kokkos-kernels
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.2'
      - run: pip install --require-hashes -r kokkos-kernels/docs/build_requirements.txt
      - name: build_docs
        working-directory: kokkos-kernels/docs
        run: |
          make html
      - name: Updload documentation as artifact
        id: deployment
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: kokkos-kernels/docs/generated_docs/

  deploy:
    if: ${{ github.ref == 'refs/heads/develop' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [macos-latest]
    needs: build
    permissions:
      contents: read
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
