name: github-DOCS

on:
  pull_request:
    types: [ opened, reopened, synchronize ]
  push:
    branches: [ develop ]

permissions:
  contents: none

jobs:

  check_updates:
    if: "!contains(github.event.pull_request.labels.*.name, 'CI: skip-docs')"
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: kokkos-kernels
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.2'
      - name: check API changes
        run: |
          cd kokkos-kernels
          git fetch &> /dev/null
          git diff --name-only origin/develop > modified_files.txt
          python scripts/check_api_updates.py

  build:
    runs-on: [macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: kokkos-kernels
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.2'
      - run: pip install --require-hashes -r kokkos-kernels/docs/build_requirements.txt
      - name: build_docs
        working-directory: kokkos-kernels/docs
        run: |
          make html
      - name: Updload documentation as artifact
        id: deployment
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: kokkos-kernels/docs/generated_docs/

  deploy:
    if: ${{ github.ref == 'refs/heads/develop' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [macos-latest]
    needs: build
    permissions:
      contents: read
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
